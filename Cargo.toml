[package]
name = "firmament"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "研究数据天穹：实时 SQLite WAL 热库与 S3 Parquet 冷库结合的数据仓库"
repository = "https://github.com/No-Trade-No-Life/Firmament"

[dependencies]
aes-gcm = "0.10"
arrow = { version = "60.0.0", default-features = false, features = ["csv"] }
async-trait = "0.1.92"
auth-mini-axum = "0.1.2"
aws-config = "1.8.18"
aws-sdk-s3 = "1.137.0"
axum = "0.8"
base64 = "0.22"
bytes = "1.12.1"
chrono = { version = "0.4", features = ["clock"] }
http = "1"
mime_guess = "2"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "system"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -2 }
suspicious = { level = "warn", priority = -2 }
style = { level = "warn", priority = -2 }
complexity = { level = "warn", priority = -2 }
needless_pass_by_value = "warn"
cloned_instead_of_copied = "warn"
redundant_closure_for_method_calls = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
semicolon_if_nothing_returned = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
