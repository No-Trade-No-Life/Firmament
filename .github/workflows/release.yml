name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
      - name: Build embedded frontend
        working-directory: web
        run: npm ci && npm run build
      - name: Build Linux binary
        run: cargo build --release --locked
      - id: version
        run: echo "tag=v0.1.0-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Package release
        run: |
          mkdir package
          cp target/release/firmament README.md LICENSE package/
          tar -C package -czf firmament-x86_64-unknown-linux-gnu.tar.gz .
          shasum -a 256 firmament-x86_64-unknown-linux-gnu.tar.gz > firmament-x86_64-unknown-linux-gnu.tar.gz.sha256
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            firmament-x86_64-unknown-linux-gnu.tar.gz
            firmament-x86_64-unknown-linux-gnu.tar.gz.sha256
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: bash .github/scripts/send-deploy.sh "$EC2_INSTANCE_ID" "${{ needs.build.outputs.tag }}"
